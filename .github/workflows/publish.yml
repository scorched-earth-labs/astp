name: publish

# Publishes the reference package `astp` to PyPI through Trusted Publishing:
# no stored token. PyPI trusts this workflow file in this repository, in the
# `pypi` environment, and nothing else.
#
# Started by hand from main. A package release carries no vMAJOR.MINOR.PATCH
# tag (GOVERNANCE.md §Releases), so there is no tag to trigger on. The upload
# waits for the `pypi` environment's required reviewer.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[neo4j,dev]" build twine
      - name: Full suite
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Check
        run: |
          twine check dist/*
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$(python -c 'import astp; print(astp.__version__)')" = "$version" \
            || { echo "::error::astp.__version__ does not match pyproject.toml ($version)"; exit 1; }
          python -c "import zipfile,sys; n=zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(not any(x.endswith('dist-info/licenses/NOTICE') for x in n))" dist/astp-"$version"-py3-none-any.whl \
            || { echo "::error::the wheel does not carry NOTICE"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/astp/$version/json")
          test "$status" = 404 \
            || { echo "::error::astp $version is already on PyPI (HTTP $status); bump the package version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astp/
    permissions:
      id-token: write  # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
