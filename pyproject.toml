[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "astp"
version = "0.3.0"
description = "ASTP (AI State Tree Protocol) — a cognitive persistence protocol for multi-agent AI systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
authors = [
    { name = "Scorched Earth Labs", email = "dev@scorchedearthlabs.com" },
]
keywords = ["ai", "agents", "persistence", "protocol", "cognitive", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/scorched-earth-labs/astp"
Documentation = "https://github.com/scorched-earth-labs/astp/blob/main/SPEC.md"
Repository = "https://github.com/scorched-earth-labs/astp"
Changelog = "https://github.com/scorched-earth-labs/astp/blob/main/CHANGELOG.md"
Issues = "https://github.com/scorched-earth-labs/astp/issues"

[tool.setuptools.packages.find]
include = ["astp*"]

[tool.setuptools.package-data]
astp = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
